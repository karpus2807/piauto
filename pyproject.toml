[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm_auto"
authors = [
  { name="SunFounder", email="service@sunfounder.com" },
]
description = "Library for monitoring Raspberry Pi system status"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.scripts]
pm-auto-oled = "pm_auto.cli_oled:main"
pm-auto-status = "pm_auto.cli_status:main"

[tool.setuptools]
packages = ["pm_auto"]

[project.urls]
"Homepage" = "https://github.com/karpus2807/piauto"
"Bug Tracker" = "https://github.com/karpus2807/piauto/issues"

[tool.setuptools.dynamic]
version = {attr = "pm_auto.__version__"}