[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm_auto"
authors = [
  { name="SunFounder", email="service@sunfounder.com" },
]
description = "Pironman automation (Max-compatible pm_auto 2.x) with multi-page OLED designer support"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

[tool.setuptools]
packages = [
  "pm_auto",
  "pm_auto.libs",
  "pm_auto.addons",
  "pm_auto.addons.oled",
  "pm_auto.addons.oled.pages",
  "pm_auto.addons.oled.designer",
  "pm_auto.addons.rgb_matrix",
  "pm_auto.addons.rgb_matrix.effects",
  ]

[project.urls]
"Homepage" = "https://github.com/karpus2807/piauto"
"Bug Tracker" = "https://github.com/karpus2807/piauto/issues"

[tool.setuptools.dynamic]
version = {attr = "pm_auto.__version__"}