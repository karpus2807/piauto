<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Upgrade — Pironman</title>
  <link rel="stylesheet" href="/upgrade/styles.css"/>
</head>
<body class="up-body">
  <div class="up-bar">
    <div class="up-bar-left">
      <strong>Upgrade</strong>
      <span id="repo-badge" class="badge">github</span>
      <span id="current-badge" class="badge muted">current —</span>
    </div>
    <div class="up-bar-right">
      <button type="button" class="btn ghost" id="btn-refresh">Refresh</button>
    </div>
  </div>
  <p class="up-hint">
    Last <strong>3 GitHub Releases</strong> from this repo. Switch to any of them — the dashboard restarts after install.
  </p>
  <div id="job-banner" class="banner hidden"></div>
  <div id="error-banner" class="banner error hidden"></div>
  <div id="release-list" class="list">
    <p class="muted">Loading releases…</p>
  </div>
  <script src="/upgrade/app.js"></script>
</body>
</html>
