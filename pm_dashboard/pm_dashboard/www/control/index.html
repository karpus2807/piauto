<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pironman Control Center</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Control Center</h1>
      <p class="sub">Full machine config — presets and sliders, minimal typing</p>
    </div>
    <div class="topbar-actions">
      <a class="btn ghost" href="/">Classic dashboard</a>
      <span id="conn" class="pill">Connecting</span>
    </div>
  </header>

  <section id="live" class="live-bar card"></section>

  <section class="card">
    <h2>Quick presets</h2>
    <p class="hint">One tap applies fan, RGB, OLED and alert defaults.</p>
    <div id="presets" class="preset-grid"></div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <main id="panels" class="panels"></main>

  <footer class="footer">
    <span id="save-status"></span>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
