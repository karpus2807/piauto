<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pironman Control Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/control/styles.css"/>
</head>
<body class="pm-body">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/control">
        <span class="brand-icon rounded-3 d-flex align-items-center justify-content-center">
          <i class="bi bi-cpu-fill"></i>
        </span>
        <span>
          <span class="d-block fw-semibold lh-1">Pironman</span>
          <small class="text-secondary fw-normal">Control Center</small>
        </span>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <span id="save-status" class="text-secondary small d-none d-md-inline"></span>
        <span id="conn" class="badge rounded-pill text-bg-secondary">Connecting</span>
        <a class="btn btn-outline-light btn-sm" href="/oled-designer">
          <i class="bi bi-display me-1"></i>OLED Designer
        </a>
        <a class="btn btn-outline-light btn-sm" href="/">
          <i class="bi bi-graph-up me-1"></i>Dashboard
        </a>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4 px-3 px-lg-4" style="max-width: 1100px;">
    <section class="mb-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0 text-white"><i class="bi bi-activity me-2 text-primary"></i>Live status</h2>
        <small class="text-secondary">Updates every 3s</small>
      </div>
      <div id="live" class="row g-2 g-md-3"></div>
    </section>

    <section class="card border-secondary shadow-sm mb-4 pm-card">
      <div class="card-body">
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
          <div>
            <h2 class="h5 card-title mb-1"><i class="bi bi-lightning-charge-fill me-2 text-warning"></i>Quick presets</h2>
            <p class="text-secondary small mb-0">One tap — fan curve, RGB, OLED pages &amp; alerts.</p>
          </div>
        </div>
        <div id="presets" class="row g-2"></div>
      </div>
    </section>

    <section class="card border-secondary shadow-sm pm-card">
      <div class="card-header bg-transparent border-secondary pt-3 pb-0">
        <ul class="nav nav-pills nav-fill flex-nowrap overflow-auto pm-tabs" id="tabs" role="tablist"></ul>
      </div>
      <div class="card-body">
        <div id="panels" class="tab-content"></div>
      </div>
    </section>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/control/app.js"></script>
</body>
</html>
