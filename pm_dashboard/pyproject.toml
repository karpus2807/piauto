[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm_dashboard"
authors = [
  { name="SunFounder", email="service@sunfounder.com" },
]
description = "Pironman dashboard (Max-compatible) with OLED Customize tab — based on SunFounder pm_dashboard 2.x"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU License",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
  "flask",
  "flask_cors",
  "influxdb",
  "pyudev",
  "configupdater",
]

[tool.setuptools]
packages = ["pm_dashboard"]
include-package-data = true

[tool.setuptools.package-data]
pm_dashboard = ["www/**/*"]

[project.urls]
"Homepage" = "https://github.com/karpus2807/piauto"
"Bug Tracker" = "https://github.com/karpus2807/piauto/issues"

[project.scripts]
pm_dashboard = "pm_dashboard:main"

[tool.setuptools.dynamic]
version = {attr = "pm_dashboard.__version__"}