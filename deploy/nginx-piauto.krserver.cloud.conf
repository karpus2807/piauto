# piauto.krserver.cloud -> local PiAuto dashboard (Flask :34001)
# FastPanel may overwrite this file if the site is re-saved in the panel.
# Keep in sync with deploy/nginx-piauto.krserver.cloud.conf in the piauto repo.

server {
    server_name piauto.krserver.cloud;
    listen 192.168.1.5:443 ssl;
    http2 on;

    ssl_certificate "/var/www/httpd-cert/krserver.cloud_2026-08-23-01-57_17.crt";
    ssl_certificate_key "/var/www/httpd-cert/krserver.cloud_2026-08-23-01-57_17.key";

    charset utf-8;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:34001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_redirect off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    include "/etc/nginx/fastpanel2-sites/krserver_clo_usr73/piauto.krserver.cloud.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/krserver_clo_usr73/data/logs/piauto.krserver.cloud-frontend.error.log;
    access_log /var/www/krserver_clo_usr73/data/logs/piauto.krserver.cloud-frontend.access.log;
}

server {
    server_name piauto.krserver.cloud;
    listen 192.168.1.5:80;
    return 301 https://$host$request_uri;

    error_log /var/www/krserver_clo_usr73/data/logs/piauto.krserver.cloud-frontend.error.log;
    access_log /var/www/krserver_clo_usr73/data/logs/piauto.krserver.cloud-frontend.access.log;
}
